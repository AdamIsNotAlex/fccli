[package]
name = "fccli"
version = "0.1.0"
edition = "2024"
rust-version = "1.96"
publish = false

[features]
default = ["production-transport"]
production-transport = []
test-transport = []

[dependencies]
anyhow = "=1.0.104"
clap = { version = "=4.6.6", features = ["derive"] }
crossterm = { version = "=0.29.0", features = ["event-stream"] }
futures-util = { version = "=0.3.33", default-features = false, features = ["std", "sink"] }
ratatui = { version = "=0.30.2", default-features = false, features = ["crossterm_0_29"] }
reqwest = { version = "=0.13.4", default-features = false, features = ["json", "query", "rustls"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
thiserror = "=2.0.20"
time = { version = "=0.3.55", features = ["formatting", "macros"] }
tokio = { version = "=1.53.1", features = ["macros", "rt-multi-thread", "sync", "time", "net"] }
tokio-tungstenite = { version = "=0.30.0", features = ["connect", "rustls-tls-native-roots"] }
tokio-util = { version = "=0.7.16", features = ["rt"] }

[dev-dependencies]
assert_cmd = "=2.2.2"
wiremock = "=0.6.5"

[target.'cfg(target_os = "linux")'.dev-dependencies]
nix = { version = "=0.30.1", default-features = false, features = ["term", "process", "fs"] }
